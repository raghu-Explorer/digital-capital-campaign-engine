version: '3.8'

services:
  eureka-server:
    build:
      context: ./eureka-server
    container_name: ventureseed-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8761
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ventureseed-network

  auth-service:
    build:
      context: ./auth-service
    container_name: ventureseed-auth
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SERVER_PORT=8081
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - ventureseed-network

  campaign-service:
    build:
      context: ./campaign-service
    container_name: ventureseed-campaign
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SERVER_PORT=8082
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - ventureseed-network

  payment-service:
    build:
      context: ./payment-service
    container_name: ventureseed-payment
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SERVER_PORT=8084
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - ventureseed-network

  contribution-service:
    build:
      context: ./contribution-service
    container_name: ventureseed-contribution
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SERVER_PORT=8083
    depends_on:
      eureka-server:
        condition: service_healthy
      campaign-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - ventureseed-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: ventureseed-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SERVER_PORT=8080
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      campaign-service:
        condition: service_started
      contribution-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - ventureseed-network

  web-dashboard:
    image: node:22-alpine
    container_name: ventureseed-frontend
    working_dir: /app
    volumes:
      - ./web-dashboard:/app
    ports:
      - "3000:3000"
    command: node server.js
    depends_on:
      - api-gateway
    networks:
      - ventureseed-network

networks:
  ventureseed-network:
    driver: bridge
